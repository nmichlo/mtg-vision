[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = {}

[tool.setuptools_scm]
fallback_version = "0.0.0" # error

[project]
name = "mtgvision"
dynamic = ["version"]  # Version is managed by setuptools_scm
description = "Realtime MTG detection and recognition."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Nathan Juraj Michlo", email = "NathanJMichlo@gmail.com" }]
urls = { Homepage = "https://github.com/nmichlo/mtg-vision" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research"
]

dependencies = [
    "doorway[extras]~=0.6.3",
    "mtgdata[convert]~=0.3.0",
    "ultralytics~=8.3.80",
    "wandb",
    "torch",
    "torchvision",
    "coremltools",
    "kornia",
    "pytorch_lightning",
    "pytorch-metric-learning",
    "ijson",
    "albumentations",
    "shapely",
    "fastapi[standard]",
    "qdrant-client",
    # norfair-rs: rust port of norfair. upstream norfair pins numpy<2, which
    # conflicts with the jax that litert-torch needs.
    "norfair-rs",
    # onnx export
    "onnxscript",
    "pyinstrument",
    "onnxconverter-common",
    # ai-edge-torch is a deprecation shim as of 0.9; litert-torch is the package
    "litert-torch",
    # embeddings
    "usearch",
    "faiss-cpu",
    "onnxruntime",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "ty>=0.0.1a1",
]

# ========================================================================= #
# tooling                                                                   #
# ========================================================================= #

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "TID", # flake8-tidy-imports
    "B009", # getattr with a constant -- use normal attribute access
    "B010", # setattr with a constant -- use normal attribute access
    # "B",   # flake8-bugbear
]
ignore = [
    "E501",   # line length is handled by the formatter
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Any disables type checking wherever it appears. Use a precise type, a TypeVar, a Protocol, or a dedicated sentinel class."
"typing.cast".msg = "cast asserts a type the checker cannot verify. Narrow with isinstance/assert, or fix the annotation."

[tool.ruff.lint.isort]
# previously `isort --profile=black --force-single-line-imports`
force-single-line = true

[tool.ruff.lint.per-file-ignores]
# `__init__.py` files are re-export hubs -- unsorted and "unused" imports are the point.
"**/__init__.py" = ["F401", "I001"]

# ========================================================================= #
# TY                                                                        #
# ========================================================================= #

# ty runs as a pre-commit hook and gates CI. it needs the dependencies
# resolvable and auto-detects `.venv`, so create one first:
#     uv sync && uvx ty check

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["data", "www"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--color=yes --verbose"

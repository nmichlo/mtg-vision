[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = {}

[tool.setuptools_scm]
fallback_version = "0.0.0" # error

[project]
name = "mtgvision"
dynamic = ["version"]  # Version is managed by setuptools_scm
description = "Realtime MTG detection and recognition."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Nathan Juraj Michlo", email = "NathanJMichlo@gmail.com" }]
urls = { Homepage = "https://github.com/nmichlo/mtg-vision" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research"
]

dependencies = [
    "doorway[extras]~=0.6.3",
    "mtgdata[convert]~=0.3.0",
    "ultralytics~=8.3.80",
    "wandb",
    "mlx",
    "mlx-data",
    "torch",
    "torchvision",
    "coremltools",
    "kornia",
    "pytorch_lightning",
    "pytorch-metric-learning",
    "ijson",
    "albumentations",
    "shapely",
    "fastapi[standard]",
    "qdrant-client",
    "norfair",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "ty>=0.0.1a1",
]

# ========================================================================= #
# tooling                                                                   #
# ========================================================================= #

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "TID", # flake8-tidy-imports
    # "B",   # flake8-bugbear
]
ignore = [
    "E501",   # line length is handled by the formatter
    "UP047",  # PEP 695 generics
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "banned -- use a precise type or a TypeVar"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--color=yes --verbose"
